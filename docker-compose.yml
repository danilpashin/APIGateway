services:
  postgres-products:
    image: postgres:15-alpine
    container_name: postgres-products
    environment:
      - POSTGRES_USER=${PRODUCT_POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${PRODUCT_POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=${PRODUCT_DB_NAME}
      - PRODUCT_DB_USER=${PRODUCT_DB_USER}
      - PRODUCT_DB_PASSWORD=${PRODUCT_DB_PASSWORD}
      - PRODUCT_MIGRATION_DB_USER=${PRODUCT_MIGRATION_DB_USER}
      - PRODUCT_MIGRATION_DB_PASSWORD=${PRODUCT_MIGRATION_DB_PASSWORD}
    ports:
      - ":5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./services/product/init.sh:/docker-entrypoint-initdb.d/init.sh

  product-migrations:
    container_name: product-migrations
    build: 
      context: .
      dockerfile: Dockerfile.product
    command: ["/product", "-cmd=up"]
    environment:
      - PRODUCT_MIGRATION_DB_USER=${PRODUCT_MIGRATION_DB_USER}
      - PRODUCT_MIGRATION_DB_PASSWORD=${PRODUCT_MIGRATION_DB_PASSWORD}
      - PRODUCT_MIGRATION_DB_URL=postgresql://${PRODUCT_MIGRATION_DB_USER}:${PRODUCT_MIGRATION_DB_PASSWORD}@postgres-products:${PRODUCT_DB_PORT}/${PRODUCT_DB_NAME}?sslmode=disable
    depends_on:
      postgres-products:
        condition: service_healthy

  product-service:
    container_name: product-service
    build:
      context: .
      dockerfile: Dockerfile.product
    depends_on:
      postgres-products:
        condition: service_healthy
      product-migrations:
        condition: service_completed_successfully
    environment:
      - PRODUCT_DB_HOST=postgres-products
      - PRODUCT_DB_PORT=${PRODUCT_DB_PORT}
      - PRODUCT_DB_NAME=${PRODUCT_DB_NAME}
      - PRODUCT_DB_USER=${PRODUCT_DB_USER}
      - PRODUCT_DB_PASSWORD=${PRODUCT_DB_PASSWORD}
      - PRODUCT_DB_URL=postgresql://${PRODUCT_DB_USER}:${PRODUCT_DB_PASSWORD}@postgres-products:${PRODUCT_DB_PORT}/${PRODUCT_DB_NAME}?sslmode=disable
    ports:
      - "${PRODUCT_PORT}:${PRODUCT_PORT}"

  postgres-users:
    image: postgres:15-alpine
    container_name: postgres-users
    environment:
      - POSTGRES_USER=${USER_POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${USER_POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=${USER_DB_NAME}
      - USER_DB_USER=${USER_DB_USER}
      - USER_DB_PASSWORD=${USER_DB_PASSWORD}
      - USER_MIGRATION_DB_USER=${USER_MIGRATION_DB_USER}
      - USER_MIGRATION_DB_PASSWORD=${USER_MIGRATION_DB_PASSWORD}
    ports:
      - ":5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./services/user/init.sh:/docker-entrypoint-initdb.d/init.sh
  
  user-migrations:
    container_name: user-migrations
    build: 
      context: .
      dockerfile: Dockerfile.user
    command: ["/user", "-cmd=up"]
    environment:
      - USER_MIGRATION_DB_USER=${USER_MIGRATION_DB_USER}
      - USER_MIGRATION_DB_PASSWORD=${USER_MIGRATION_DB_PASSWORD}
      - USER_MIGRATION_DB_URL=postgresql://${USER_MIGRATION_DB_USER}:${USER_MIGRATION_DB_PASSWORD}@postgres-users:${USER_DB_PORT}/${USER_DB_NAME}?sslmode=disable
    depends_on:
      postgres-users:
        condition: service_healthy

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: Dockerfile.user
    depends_on:
      postgres-users:
        condition: service_healthy
      user-migrations:
        condition: service_completed_successfully
    environment:
      - USER_DB_HOST=postgres-users
      - USER_DB_PORT=${USER_DB_PORT}
      - USER_DB_NAME=${USER_DB_NAME}
      - USER_DB_USER=${USER_DB_USER}
      - USER_DB_PASSWORD=${USER_DB_PASSWORD}
      - USER_DB_URL=postgresql://${USER_DB_USER}:${USER_DB_PASSWORD}@postgres-users:${USER_DB_PORT}/${USER_DB_NAME}?sslmode=disable
    ports:
      - "${USER_PORT}:${USER_PORT}"