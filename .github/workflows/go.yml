name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.3'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build test images
      run: |
        docker compose -f docker-compose.test.yml build

    - name: Create coverage directory
      run: mkdir -p coverage-results

    - name: Run product tests
      run: |
        docker compose -f docker-compose.test.yml up product-tests
        docker cp product-tests:/app/coverage_share/product.out ./coverage-results/product.out
    
    - name: Run user tests
      run: |
        docker compose -f docker-compose.test.yml up user-tests
        docker cp user-tests:/app/coverage_share/user.out ./coverage-results/user.out

    - name: Cleanup
      if: always()
      run: docker compose -f docker-compose.test.yml down --volumes

    - name: Merge coverage profiles
      run: |
        echo "mode: set" > total-coverage.out
        ls -la ./coverage-results/ || true

        if compgen -G "./coverage-results/*.out" > /dev/null; then
          grep -h -v "^mode:" ./coverage-results/*.out >> total-coverage.out
          echo "Files merged successfully."
        else
          echo "Files *.out not found in ./coverage-results/"
        fi

    - name: Generate Coverage Badge Manually
      run: |
        COVERAGE=$(go tool cover -func=total-coverage.out | grep total | grep -oE '[0-9]+\.[0-9]+')
        echo "Calculated coverage: $COVERAGE%"
        
        sed -E "s/([cC]overage-)[0-9]+(\.[0-9]+)?/\1$COVERAGE%/g" README.md > README.tmp && mv README.tmp README.md

    - name: Verify Changed files
      uses: tj-actions/verify-changed-files@v16
      id: verify-changed-files
      with:
        files: README.md

    - name: Commit changes
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git commit -m "chore: Updated coverage badge."

    - name: Push changes
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ github.token }}
        branch: ${{ github.head_ref }}
