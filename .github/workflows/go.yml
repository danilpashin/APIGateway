name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0  

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build test images
      run: |
        docker compose -f docker-compose.test.yml build

    - name: Create coverage directory
      run: mkdir -p coverage-results

    - name: Run product tests
      run: |
        docker compose -f docker-compose.test.yml run --rm product-tests
    
    - name: Run user tests
      run: |
        docker compose -f docker-compose.test.yml run --rm user-tests

    - name: Merge coverage profiles
      run: |
        echo "mode: set" > total-coverage.out
        grep -h -v "^mode:" ./coverage-results/*.out >> total-coverage.out

    - name: Go Coverage Badge
      uses: tj-actions/coverage-badge-go@v3
      with:
        filename: total-coverage.out

    - name: Verify Changed files
      uses: tj-actions/verify-changed-files@v16
      id: verify-changed-files
      with:
        files: README.md

    - name: Commit changes
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git commit -m "chore: Updated coverage badge."

    - name: Push changes
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ github.token }}
        branch: ${{ github.head_ref }}

    - name: Cleanup
      if: always()
      run: docker compose -f docker-compose.test.yml down --volumes
